# -------------------------------------------------------
# Datasource
# -------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ECOMMERCE_DB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=0004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------
# JWT
# -------------------------------------------------------
security.jwt.secret=${JWT_SECRET:defaultDevSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm!!}
security.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}
google.oauth.client-id=${GOOGLE_CLIENT_ID:654177765040-742kbr08fgphkafqnkigb84jnj78o2nj.apps.googleusercontent.com}

# -------------------------------------------------------
# CORS
# -------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# -------------------------------------------------------
# Server
# -------------------------------------------------------
server.port=${SERVER_PORT:8080}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.upload.dir=${UPLOAD_DIR:uploads/products}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# -------------------------------------------------------
# OpenAPI
# -------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
