# Catalog
# How long a product carries the "New" badge, counted from PUBLISHED_AT in UTC. The boundary is
# exclusive: at exactly this many days the badge is gone. One value, read by NewProductPolicy —
# it used to be a 30 * 86400000 literal inside a browser-side mapping function.
app.catalog.new-product-days=${NEW_PRODUCT_DAYS:30}
app.email.outbox.poll-delay-ms=${EMAIL_OUTBOX_POLL_DELAY_MS:2000}
app.email.outbox.max-attempts=${EMAIL_OUTBOX_MAX_ATTEMPTS:8}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# -------------------------------------------------------
# OpenAPI
# -------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Reservation window for unpaid orders. Stock is deducted when an order is created, so an
# abandoned checkout must have its stock released or those units are held forever.
app.orders.unpaid-expiry-minutes=${UNPAID_ORDER_EXPIRY_MINUTES:30}
app.orders.unpaid-expiry.enabled=${UNPAID_ORDER_EXPIRY_ENABLED:true}
app.orders.unpaid-expiry.poll-delay-ms=${UNPAID_ORDER_EXPIRY_POLL_MS:300000}
